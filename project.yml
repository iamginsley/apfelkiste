name: Apfelkiste
options:
  bundleIdPrefix: com.iamginsley
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Configs/Project.xcconfig
  Release: Configs/Project.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic

targets:
  Apfelkiste:
    type: application
    platform: macOS
    sources:
      - path: Apfelkiste
    entitlements:
      path: Apfelkiste/Resources/Apfelkiste.entitlements
      properties:
        # No sandbox: the app reads other apps' bundles and ~/Library and moves them to the Trash,
        # which the App Sandbox forbids. Distribution is Developer ID signed and notarized.
        com.apple.security.app-sandbox: false
    info:
      path: Apfelkiste/Resources/Info.plist
      properties:
        CFBundleDisplayName: Apfelkiste
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: © 2026 Dominik Gintsberger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamginsley.apfelkiste
        PRODUCT_NAME: Apfelkiste
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ENABLE_PREVIEWS: YES

  ApfelkisteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ApfelkisteTests
    dependencies:
      - target: Apfelkiste
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamginsley.apfelkiste.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Apfelkiste.app/Contents/MacOS/Apfelkiste"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Apfelkiste:
    build:
      targets:
        Apfelkiste: all
        ApfelkisteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ApfelkisteTests
